  <div class="container" style="margin-top: 30em;">
 <h1>Resume Builder</h1>
 <div class="builder" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start;">
 <!-- Form -->
 <div class="form-container">
 <h2>Enter Your Details</h2>
 <input type="text" id="name" placeholder="Full Name">
 <input type="email" id="email" placeholder="Email">
 <input type="text" id="phone" placeholder="Phone">
 <input type="text" id="address" placeholder="Address">
 <textarea id="summary" placeholder="Profile Summary"></textarea>
 <input type="text" id="skills" placeholder="Skills (comma separated)">
 <input type="text" id="projects" placeholder="Projects (comma separated)">
 <button id="saveResumeFirestoreBtn">Save Resume to Cloud</button>
 <button id="downloadBtn">Download PDF</button>
 </div>

 <!-- Resume Preview -->
 <div class="preview-container" style="background: linear-gradient(135deg, #667eea 0%, #9a70c5 100%); color: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
  <div style="text-align: center; border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 20px; margin-bottom: 20px;">
    <h2 id="previewName" style="margin: 0; font-size: 28px;">Your Name</h2>
    <p id="previewContact" style="margin: 8px 0 0 0; font-size: 14px; opacity: 0.9;">Email | Phone | Address</p>
  </div>
  
  <div style="margin-bottom: 20px;">
    <h3 style="margin: 0 0 8px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">Profile Summary</h3>
    <p id="previewSummary" style="margin: 0; font-size: 14px; line-height: 1.6; opacity: 0.95;">Summary will appear here.</p>
  </div>

  <div style="margin-bottom: 20px;">
    <h3 style="margin: 0 0 8px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">Skills</h3>
    <p id="previewSkills" style="margin: 0; font-size: 14px; line-height: 1.6; opacity: 0.95;">Skills will appear here.</p>
  </div>

  <div>
    <h3 style="margin: 0 0 8px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">Projects</h3>
    <p id="previewProjects" style="margin: 0; font-size: 14px; line-height: 1.6; opacity: 0.95;">Projects will appear here.</p>
  </div>
 </div>
